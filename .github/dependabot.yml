version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Les types suivent le runtime (Node 24 LTS) : majeure montée à la main avec .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # On reste sur une LTS ; la majeure se change à la main avec .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
