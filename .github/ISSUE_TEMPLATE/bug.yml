name: Bug
description: Un comportement qui ne correspond pas aux règles ou qui casse
labels: ['type: bug']
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Rôle, journée, graine de la ville si connue, étapes.
      placeholder: |
        1. Standardiste, lundi, graine 1953
        2. Brancher la paire 1 sur la 141…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journal d'événements ou console
      render: text
