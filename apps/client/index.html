<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allô Central</title>
    <style>
      body:has(> canvas) {
        overflow: hidden;
      }
      body {
        margin: 0;
        background: #17110d;
        color: #f3eada;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        inset: 0 0 auto 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        min-height: 64px;
        box-sizing: border-box;
        padding: 8px 16px;
        border-bottom: 1px solid #3e2e22;
        background: #17110dee;
      }
      .hud .clock {
        min-width: 110px;
        font:
          600 28px ui-monospace,
          monospace;
        color: #c9a44c;
      }
      .hud select,
      .hud button {
        min-height: 40px;
        padding: 4px 12px;
        border: 1px solid #5a4430;
        border-radius: 6px;
        background: #221912;
        color: #f3eada;
        font: inherit;
      }
      .hud button {
        border-color: #c9a44c;
        cursor: pointer;
      }
      .hud button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .headset {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
        max-width: calc(100% - 32px);
        margin: 8px 0 0;
        padding: 8px 16px;
        border: 1px solid #5a4430;
        border-radius: 999px;
        background: #221912;
        color: #f6dfa6;
        font-style: italic;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .headset p {
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .headset button {
        flex: none;
        min-height: 32px;
        padding: 2px 12px;
        border: 1px solid #c9a44c;
        border-radius: 999px;
        background: #3a2a0c;
        color: #f3eada;
        font: inherit;
        font-style: normal;
        cursor: pointer;
      }
      .lobby {
        box-sizing: border-box;
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      .lobby h1 {
        margin: 0;
        font-size: 56px;
        letter-spacing: -1px;
      }
      .lobby .tagline {
        margin: 8px 0 0;
        color: #d8cbb2;
        font-size: 18px;
      }
      .lobby .warning {
        margin: 20px 0 0;
        padding: 12px 16px;
        border: 1px solid #c9a44c;
        border-radius: 10px;
        background: #221912;
      }
      .lobby section {
        margin-top: 28px;
      }
      .lobby h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #c9a44c;
      }
      .lobby fieldset {
        display: grid;
        gap: 8px;
        margin: 0 0 12px;
        padding: 0;
        border: 0;
      }
      .lobby legend {
        margin-bottom: 8px;
        color: #bfaf92;
      }
      .lobby fieldset label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid #3e2e22;
        border-radius: 8px;
        cursor: pointer;
      }
      .lobby input[type='radio'] {
        accent-color: #c9a44c;
      }
      .lobby small {
        color: #bfaf92;
      }
      .lobby .join {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .lobby input#code {
        width: 120px;
        padding: 8px 12px;
        border: 1px solid #5a4430;
        border-radius: 8px;
        background: #221912;
        color: #f3eada;
        font:
          600 22px ui-monospace,
          monospace;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
      .lobby button {
        min-height: 44px;
        padding: 6px 18px;
        border: 1px solid #c9a44c;
        border-radius: 8px;
        background: #221912;
        color: #f3eada;
        font: inherit;
        cursor: pointer;
      }
      .lobby button.primary {
        background: #c9a44c;
        color: #17110d;
        font-weight: 600;
      }
      .lobby button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .lobby .error {
        min-height: 1.4em;
        color: #f0604c;
      }
      .hud .room {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        color: #bfaf92;
        font-size: 14px;
      }
      .hud .room strong {
        color: #f3eada;
        font-family: ui-monospace, monospace;
        letter-spacing: 1px;
      }
      .hud .room button {
        min-height: 32px;
        padding: 2px 10px;
        font-size: 13px;
      }
      .hud .room.paused .partner {
        color: #f0604c;
        font-weight: 600;
      }
      .desk {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 128px 16px 24px;
      }
      .desk {
        --desk-scale: 1;
        max-width: 1100px;
        margin: 0 auto;
      }
      .desk-tabs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .desk-tab,
      .desk-zoom button,
      .paper-nav button {
        min-height: 44px;
        padding: 6px 16px;
        border: 1px solid #5a4430;
        border-radius: 8px;
        background: #221912;
        color: #f3eada;
        font: inherit;
        cursor: pointer;
      }
      .desk-tab[aria-selected='true'] {
        border-color: #c9a44c;
        background: #c9a44c;
        color: #17110d;
        font-weight: 600;
      }
      .desk-tab:disabled,
      .paper-nav button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .desk-zoom {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      .paper {
        padding: 20px 24px;
        border-radius: 6px;
        background: #f3eada;
        color: #17110d;
        font-size: calc(16px * var(--desk-scale));
        box-shadow: 0 6px 24px #0008;
      }
      .paper:focus-visible {
        outline: 3px solid #c9a44c;
        outline-offset: 3px;
      }
      .paper-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid #17110d;
      }
      .paper-head h3 {
        margin: 0;
        font-size: 1.2em;
        letter-spacing: 1px;
      }
      .paper-position {
        color: #6e5a40;
        font-size: 0.85em;
      }
      .paper-nav {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
      }
      .paper-nav button {
        border-color: #6e5a40;
        background: #e7dac0;
        color: #17110d;
      }
      .directory,
      .card {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .directory li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: baseline;
        gap: 0 8px;
        padding: 8px 0;
        border-bottom: 1px dotted #b8a888;
      }
      .directory .dots {
        border-bottom: 2px dotted #6e5a40;
      }
      .directory .line {
        font:
          700 1.1em ui-monospace,
          monospace;
      }
      .directory .address,
      .card .address {
        grid-column: 1 / -1;
        color: #6e5a40;
        font-size: 0.85em;
      }
      .card li {
        display: flex;
        flex-direction: column;
        padding: 10px 0;
        border-bottom: 1px dotted #b8a888;
      }
      .map-paper {
        padding: 12px;
      }
      .map {
        display: block;
        width: 100%;
        height: auto;
      }
      .map .street {
        stroke: #c8b896;
        stroke-width: 14;
        stroke-linecap: round;
      }
      .map text {
        paint-order: stroke;
        stroke: #f3eada;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .map .street-name {
        fill: #3a2a0c;
        font-size: calc(12px * var(--desk-scale));
        font-style: italic;
      }
      .map .house {
        fill: #6e3e20;
      }
      .map .house-number {
        fill: #6e3e20;
        font-size: calc(10px * var(--desk-scale));
      }
      .map .landmark {
        fill: #8c5a2e;
      }
      .map .landmark-name {
        fill: #17110d;
        font-size: calc(14px * var(--desk-scale));
        font-weight: 700;
      }
      .desk-empty {
        max-width: 560px;
        margin: 64px auto;
        color: #bfaf92;
        font-size: 18px;
        text-align: center;
      }
      .report {
        box-sizing: border-box;
        width: min(460px, calc(100% - 32px));
        padding: 24px 28px;
        border: 1px solid #c9a44c;
        border-radius: 14px;
        background: #221912;
        color: #f3eada;
      }
      .report::backdrop {
        background: #0a0705cc;
      }
      .report h2 {
        margin: 0;
        font-size: 24px;
      }
      .report .stars {
        margin: 8px 0 0;
        font-size: 44px;
        letter-spacing: 6px;
        color: #c9a44c;
      }
      .report .rate {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      .report .verdict {
        margin: 6px 0 16px;
        color: #bfaf92;
        font-size: 14px;
      }
      .report .verdict.replay {
        color: #f0604c;
      }
      .report dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 16px;
        margin: 0 0 20px;
        font-size: 15px;
      }
      .report dt {
        color: #bfaf92;
      }
      .report dd {
        margin: 0;
        text-align: right;
      }
      .report .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }
      .report button {
        min-height: 44px;
        padding: 6px 16px;
        border: 1px solid #5a4430;
        border-radius: 8px;
        background: #17110d;
        color: #f3eada;
        font: inherit;
        cursor: pointer;
      }
      .report button.primary {
        border-color: #c9a44c;
        background: #c9a44c;
        color: #17110d;
        font-weight: 600;
      }
      .hud .status {
        margin: 0;
        color: #bfaf92;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
