services:
  app:
    build: .
    image: ghcr.io/alorthios/central:local
    ports:
      - '${APP_PORT:-8053}:3000'
    environment:
      # Serveurs ICE pour la voix, transmis aux clients (voir README, « Jouer à distance »).
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Salles de test `?dev` : ouvertes en local ; mettre DEV_ROOMS=0 sur un serveur public.
      DEV_ROOMS: ${DEV_ROOMS:-1}
    restart: unless-stopped

  # Profil `remote` : HTTPS (le micro l'exige hors localhost) et relais TURN.
  caddy:
    image: caddy:2.10-alpine
    profiles: [remote]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Réseau de l'hôte : coturn doit annoncer son adresse publique et relayer une plage de ports UDP.
  coturn:
    image: coturn/coturn:4.7
    profiles: [remote]
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      # Adresse publique annoncée aux joueurs, détectée par l'image (serveur derrière un NAT).
      - --external-ip=$$(detect-external-ip)
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${DOMAIN:-localhost}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Le relais ne doit mener qu'aux joueurs, jamais au réseau interne du serveur.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
